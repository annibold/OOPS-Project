<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Notifications</title></head>
<body>
<h2>My notifications</h2>
<table border="1" cellpadding="6">
    <tr><th>Time</th><th>Channel</th><th>Message</th></tr>
    <tr th:each="n : ${notifications}">
        <td th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm:ss')}"></td>
        <td th:text="${n.channel}"></td>
        <td th:text="${n.message}"></td>
    </tr>
</table>
<p><a th:href="@{/home}">Back to dashboard</a></p>
</body>
</html>
