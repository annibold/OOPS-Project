<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assigned Incidents - I-ITSM</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar" style="background:#1e293b;">
    <a class="brand" th:href="@{/technician/home}" style="color:#38bdf8;">⚡ I-ITSM <span style="font-size:0.8rem; font-weight:normal; color:#94a3b8;">| Engineering Console</span></a>
    <ul class="navbar-nav">
        <li><a th:href="@{/technician/home}">Dashboard</a></li>
        <li><a th:href="@{/technician/incidents}" style="color:white; font-weight:600;">Assigned Incidents</a></li>
        <li><a th:href="@{/notifications}">🔔 Notifications</a></li>
        <li>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </li>
    </ul>
</header>

<div class="container">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2>🛠️ Assigned Incident Queue</h2>
            <div style="padding:6px 14px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:20px; font-size:0.88rem; color:#1e40af;">
                Current Workload: <b th:text="${workload}"></b> / 5 active ticket(s)
            </div>
        </div>

        <div th:if="${incidents.empty}" class="alert alert-info">
            Great job! You currently have no unresolved incidents assigned.
        </div>

        <div th:if="${!incidents.empty}" class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${incidents}">
                        <td><a th:href="@{/technician/incidents/{id}(id=${i.id})}" th:text="'#' + ${i.id}" style="font-weight:600; color:var(--primary);"></a></td>
                        <td>
                            <a th:href="@{/technician/incidents/{id}(id=${i.id})}" th:text="${i.title}" style="color:var(--text-main); text-decoration:none; font-weight:500;"></a>
                        </td>
                        <td th:text="${i.category}"></td>
                        <td>
                            <span th:class="'badge badge-' + ${#strings.toLowerCase(i.priority)}" th:text="${i.priority}"></span>
                        </td>
                        <td>
                            <span class="badge badge-status" th:text="${i.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(i.createdAt, 'dd MMM HH:mm')}"></td>
                        <td>
                            <a th:href="@{/technician/incidents/{id}(id=${i.id})}" class="btn btn-primary" style="padding:4px 10px; font-size:0.8rem;">Investigate &rarr;</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
