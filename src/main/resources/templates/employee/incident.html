<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Incident</title></head>
<body>
<h2>Incident #<span th:text="${incident.id}"></span></h2>

<!-- Flash messages -->
<p th:if="${success}" th:text="${success}" style="color:green; font-weight:bold"></p>
<p th:if="${error}"   th:text="${error}"   style="color:red; font-weight:bold"></p>

<!-- Incident details -->
<table border="1" cellpadding="6">
    <tr><td><b>Title</b></td>      <td th:text="${incident.title}"></td></tr>
    <tr><td><b>Description</b></td><td th:text="${incident.description}"></td></tr>
    <tr><td><b>Category</b></td>   <td th:text="${incident.category}"></td></tr>
    <tr><td><b>Priority</b></td>   <td th:text="${incident.priority}"></td></tr>
    <tr><td><b>Status</b></td>     <td th:text="${incident.status}"></td></tr>
    <tr><td><b>Assigned to</b></td>
        <td th:text="${incident.assignedTechnician != null} ? ${incident.assignedTechnician.name} : 'Not yet assigned'"></td></tr>
    <tr><td><b>Created</b></td>    <td th:text="${#temporals.format(incident.createdAt, 'dd MMM yyyy HH:mm')}"></td></tr>
    <tr><td><b>Resolved at</b></td>
        <td th:text="${incident.resolvedAt != null} ? ${#temporals.format(incident.resolvedAt, 'dd MMM yyyy HH:mm')} : '-'"></td></tr>
    <tr><td><b>Resolution</b></td>
        <td th:text="${incident.resolution != null} ? ${incident.resolution} : '-'"></td></tr>
</table>

<!-- Verify resolution (employee confirms the fix works) -->
<div th:if="${incident.status.name() == 'RESOLVED'}" style="margin-top:16px; padding:12px; border:1px solid #27ae60; background:#eafaf1;">
    <h3 style="margin-top:0; color:#27ae60;">Resolution provided &mdash; does this fix your issue?</h3>
    <form th:action="@{/employee/incidents/{id}/verify(id=${incident.id})}" method="post" style="display:inline">
        <button type="submit" style="background:#27ae60; color:white; padding:8px 16px; font-size:14px; cursor:pointer; border:none; border-radius:4px;">
            Yes &mdash; Mark as Verified &#10004;
        </button>
    </form>
    <form th:action="@{/employee/incidents/{id}/reopen(id=${incident.id})}" method="post" style="display:inline; margin-left:12px">
        <button type="submit" style="background:#e67e22; color:white; padding:8px 16px; font-size:14px; cursor:pointer; border:none; border-radius:4px;">
            No &mdash; Reopen Incident &#8617;
        </button>
    </form>
</div>

<!-- Investigation notes from technician -->
<h3>Investigation Notes</h3>
<p th:if="${notes.empty}" style="color:grey">No notes yet.</p>
<ul>
    <li th:each="n : ${notes}" style="margin-bottom:6px">
        <span th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}" style="color:grey"></span>
        &mdash; <b th:text="${n.author}"></b>: <span th:text="${n.text}"></span>
    </li>
</ul>

<p style="margin-top:20px;">
    <a th:href="@{/employee/incidents}">&larr; Back to my incidents</a> |
    <a th:href="@{/employee/home}">Employee Home</a>
</p>
</body>
</html>
