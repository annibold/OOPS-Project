<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>My incidents</title></head>
<body>
<h2>My incidents</h2>
<table border="1" cellpadding="6">
    <tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Technician</th></tr>
    <tr th:each="i : ${incidents}">
        <td><a th:href="@{/employee/incidents/{id}(id=${i.id})}" th:text="${i.id}"></a></td>
        <td th:text="${i.title}"></td>
        <td th:text="${i.category}"></td>
        <td th:text="${i.priority}"></td>
        <td th:text="${i.status}"></td>
        <td th:text="${i.assignedTechnician != null} ? ${i.assignedTechnician.name} : '-'"></td>
    </tr>
</table>
<p><a th:href="@{/employee/home}">Back</a></p>
</body>
</html>
