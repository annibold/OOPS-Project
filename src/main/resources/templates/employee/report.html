<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Incident - I-ITSM</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar">
    <a class="brand" th:href="@{/employee/home}">⚡ I-ITSM <span style="font-size:0.8rem; font-weight:normal; color:#94a3b8;">| Employee Portal</span></a>
    <ul class="navbar-nav">
        <li><a th:href="@{/employee/home}">Dashboard</a></li>
        <li><a th:href="@{/employee/report}" style="color:white; font-weight:600;">+ Report Issue</a></li>
        <li><a th:href="@{/employee/incidents}">My Incidents</a></li>
        <li><a th:href="@{/notifications}">🔔 Notifications</a></li>
        <li>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </li>
    </ul>
</header>

<div class="container" style="max-width:750px;">
    <div class="card">
        <h2>📢 Report an Incident</h2>
        <p style="color:var(--text-muted); margin-bottom:20px;">Provide clear details so our IT engineers can diagnose and assign the right specialist quickly.</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/employee/report}" method="post" style="display:flex; flex-direction:column; gap:16px;">
            <div>
                <label style="display:block; font-weight:600; margin-bottom:6px;">Incident Title *</label>
                <input type="text" name="title" style="width:100%;" placeholder="Brief summary (e.g., VPN connectivity failing on Mumbai gateway)" required autofocus>
            </div>

            <div>
                <label style="display:block; font-weight:600; margin-bottom:6px;">Detailed Description</label>
                <textarea name="description" rows="4" style="width:100%;" placeholder="What were you trying to do, what error message appeared, and who is affected?"></textarea>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Service Category *</label>
                    <select name="category" style="width:100%;">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Impact *</label>
                    <select name="impact" style="width:100%;">
                        <option value="1">1 - Single User / Low</option>
                        <option value="2">2 - Department / Moderate</option>
                        <option value="3">3 - Entire Organization / High</option>
                    </select>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div>
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Urgency *</label>
                    <select name="urgency" style="width:100%;">
                        <option value="1">1 - Workaround Available</option>
                        <option value="2">2 - Critical Work Impaired</option>
                        <option value="3">3 - Complete Business Stoppage</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Business Criticality *</label>
                    <select name="criticality" style="width:100%;">
                        <option value="1">1 - Non-Core Internal Service</option>
                        <option value="2">2 - Important Operational Tool</option>
                        <option value="3">3 - Mission-Critical Customer Facing</option>
                    </select>
                </div>
            </div>

            <div style="margin-top:10px; display:flex; gap:12px;">
                <button type="submit" class="btn btn-primary" style="padding:10px 20px;">Submit Incident Ticket</button>
                <a th:href="@{/employee/home}" class="btn btn-secondary" style="padding:10px 18px;">Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
