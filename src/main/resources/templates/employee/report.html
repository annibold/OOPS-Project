<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Report incident</title></head>
<body>
<h2>Report an incident</h2>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/employee/report}" method="post">
    <label>Title <input type="text" name="title"></label><br>
    <label>Description<br><textarea name="description" rows="4" cols="50"></textarea></label><br>
    <label>Category
        <select name="category">
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
    </label><br>
    <label>Impact
        <select name="impact">
            <option value="1">1 - Low</option><option value="2">2 - Medium</option><option value="3">3 - High</option>
        </select>
    </label><br>
    <label>Urgency
        <select name="urgency">
            <option value="1">1 - Low</option><option value="2">2 - Medium</option><option value="3">3 - High</option>
        </select>
    </label><br>
    <label>Business criticality
        <select name="criticality">
            <option value="1">1 - Low</option><option value="2">2 - Medium</option><option value="3">3 - High</option>
        </select>
    </label><br>
    <button type="submit">Submit</button>
</form>
<p><a th:href="@{/employee/home}">Back</a></p>
</body>
</html>
