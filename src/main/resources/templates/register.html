<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - I-ITSM</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:90vh; background:#f1f5f9;">

<div class="card" style="width:100%; max-width:440px; padding:32px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);">
    <div style="text-align:center; margin-bottom:24px;">
        <h1 style="color:#2563eb; font-size:1.8rem; margin-bottom:6px;">⚡ I-ITSM</h1>
        <p style="color:var(--text-muted); font-size:0.95rem;">Create Employee Account</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" style="display:flex; flex-direction:column; gap:16px;">
        <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Full Name *</label>
            <input type="text" name="name" style="width:100%;" placeholder="e.g. Rahul Sharma" required autofocus>
        </div>
        <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Company Email *</label>
            <input type="text" name="email" style="width:100%;" placeholder="e.g. rahul@itsm.com" required>
        </div>
        <div>
            <label style="display:block; font-size:0.85rem; font-weight:600; margin-bottom:4px;">Password (6+ characters) *</label>
            <input type="password" name="password" style="width:100%;" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="padding:10px; font-weight:600; margin-top:8px;">Register Account</button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:0.85rem;">
        Already registered? <a th:href="@{/login}" style="color:var(--primary); font-weight:600;">Sign in here</a>
    </p>
</div>

</body>
</html>
